  portfolio:
    path: ../../features/portfolio
  about:
    path: ../../features/about
  contact:
    path: ../../features/contact

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
