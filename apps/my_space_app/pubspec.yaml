name: my_space_app
description: My Space adaptive app
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  flutter_bloc: ^8.1.6
  injectable: ^2.5.0
  get_it: ^8.0.2
  core_ui:
    path: ../../packages/core/core_ui
  core_platform:
    path: ../../packages/core/core_platform
  core_observability:
