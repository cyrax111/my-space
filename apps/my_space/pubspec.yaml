name: my_space
description: My personal space - portfolio, blog, and more
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core packages
  core_domain:
    path: ../../packages/core_domain
  core_ui:
    path: ../../packages/core_ui
  core_logging:
    path: ../../packages/core_logging
  core_storage:
    path: ../../packages/core_storage
  
  # Features
  feature_blog:
    path: ../../packages/feature_blog
  feature_portfolio:
    path: ../../packages/feature_portfolio
  feature_about:
    path: ../../packages/feature_about
  feature_contact:
    path: ../../packages/feature_contact
  
  # Navigation
  go_router: ^13.0.0
  
  # DI
  injectable: ^2.3.2
  get_it: ^7.6.4
  
  # State management
  flutter_bloc: ^8.1.3
  
  # Utilities
  fpdart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - images/
  #   - icons/
