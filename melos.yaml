name: my_space
repository: https://github.com/cyrax111/my-space

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    runPubGetInParallel: true
    
  version:
    branch: main
    
scripts:
  analyze:
    exec: flutter analyze
    description: Run flutter analyze for all packages
    
  format:
    exec: dart format --set-exit-if-changed .
    description: Run dart format for all packages
    
  test:
    exec: flutter test --coverage --no-pub
    description: Run flutter test for all packages
    packageFilters:
      dirExists: test
      
  test:unit:
    exec: flutter test --coverage --no-pub --exclude-tags=integration
    description: Run unit tests for all packages
    packageFilters:
      dirExists: test
      
  test:integration:
    exec: flutter test --coverage --no-pub --tags=integration
    description: Run integration tests for all packages
    packageFilters:
      dirExists: test
      
  coverage:
    exec: |
      flutter test --coverage --no-pub
      lcov --remove coverage/lcov.info '**/*.g.dart' '**/*.freezed.dart' '**/*.config.dart' -o coverage/lcov.info
    description: Generate coverage reports
    packageFilters:
      dirExists: test
      
  build:runner:
    exec: flutter pub run build_runner build --delete-conflicting-outputs
    description: Run build_runner for code generation
    
  build:runner:watch:
    exec: flutter pub run build_runner watch --delete-conflicting-outputs
    description: Run build_runner in watch mode
    
  clean:
    exec: flutter clean
    description: Clean all packages
    
  clean:deep:
    exec: |
      flutter clean
      rm -rf pubspec.lock
      rm -rf .dart_tool
    description: Deep clean all packages
